import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'net.neoforged.moddev.legacyforge'
    id 'idea'
    id 'net.darkhax.curseforgegradle' version '1.+'
    id 'com.modrinth.minotaur' version '2.+'
}

archivesBaseName = "${mod_id}-neoforge-${neo_supported_versions}"

legacyForge {
    version = minecraft_version + '-' + neoforge_version

    parchment {
        minecraftVersion = parchment_mc
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {

            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            systemProperty('forge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(":common")

    // JEI
    if (project.hasProperty('jei_version')) {
        compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
        compileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
        runtimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
    // CONFIGURED
    if (project.hasProperty('configured_version')) {
        implementation("curse.maven:configured-457570:${configured_version}")
    }
    // CATALOGUE
    if (project.hasProperty('catalogue_version')) {
        implementation("curse.maven:catalogue-459701:${catalogue_version}")
    }

    runtimeOnly("curse.maven:applied-energistics-2-223794:6091401") // https://www.curseforge.com/minecraft/mc-mods/applied-energistics-2/files
    runtimeOnly("curse.maven:polymorph-388800:5995253") // https://www.curseforge.com/minecraft/mc-mods/polymorph/files

}

processResources {
    from project(":common").sourceSets.main.resources
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            file: 'META-INF/mods.toml',
            version: version
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

jar.finalizedBy('reobfJar')

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = file('../../API Tokens/ae2qolrecipes.md')
    def projectId = "${cf_id}".toString()
    def mainFile = upload(projectId, file("${project.buildDir}/libs/${archivesBaseName}-${version}.jar"))

    disableVersionDetection()
    mainFile.addJavaVersion("Java " + "${java_version}")
    mainFile.addModLoader("${project.name}")

    mainFile.changelogType = 'markdown'
    mainFile.changelog = file('changelog.md')
    mainFile.addGameVersion('Server')
    mainFile.releaseType = "${release_type}"
    "${neoforge_release_versions}".split(',').each {
        mainFile.addGameVersion("${it}")
    }
    mainFile.addRequirement("applied-energistics-2")
    mainFile.addOptional("catalogue")
}

modrinth {
    token = file('../../API Tokens/modrinth.md').text
    projectId = modrinth_id
    versionType = release_type
    changelog = file('changelog.md').text
    gameVersions = neoforge_release_versions.split(",") as List<String>
    loaders.add(project.name)
    detectLoaders = false
    versionName = "${archivesBaseName}-${version}"
    uploadFile = layout.buildDirectory.file("libs/${archivesBaseName}-${version}.jar").get().asFile

    dependencies {
        required.project "ae2"
    }
}